<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Felix Visualiser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 200px;
    height: 200px;
    background: transparent;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
  }

  /* S2 #576 (ADR-0016 (c)): "Felix is driving" badge + Stop control.
     Hidden by default; body.driving flips it on. The Stop button is the
     only interactive element on the click-through overlay -- main.js
     toggles setIgnoreMouseEvents so the click actually lands.
     #594 (ADR-0016 amendment f): mode-aware styling. Foreground (default)
     keeps the original urgent purple/pink -- a moving cursor means the user
     can't use the PC. body.mode-background swaps in a calmer blue: a
     background action has no cursor, so "surface harder" means legible, not
     alarming. A #593 soft trip flips the class in real time (main.js already
     re-sends on every mode change). */
  .driving-panel {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: rgba(30, 10, 60, 0.85);
    border: 1px solid rgba(232, 121, 249, 0.6);
    border-radius: 8px;
    padding: 6px 10px;
    color: #f5d0fe;
    font: 600 11px system-ui, -apple-system, sans-serif;
    text-align: center;
    pointer-events: auto;
    box-shadow: 0 0 12px rgba(232, 121, 249, 0.35);
    max-width: 190px;
  }
  body.driving .driving-panel { display: flex; }

  body.driving.mode-background .driving-panel {
    background: rgba(8, 30, 48, 0.85);
    border-color: rgba(96, 165, 250, 0.6);
    color: #bfdbfe;
    box-shadow: 0 0 12px rgba(96, 165, 250, 0.35);
  }

  .driving-panel button {
    all: unset;
    cursor: pointer;
    background: #b91c1c;
    color: #fff;
    padding: 3px 12px;
    border-radius: 4px;
    font: 700 11px system-ui, -apple-system, sans-serif;
    letter-spacing: 0.5px;
  }
  .driving-panel button:hover { background: #dc2626; }

  /* S15 #609: Take-over / Release button lives alongside Stop; a blue
     "take turns" affordance rather than the red panic Stop. It ONLY shows
     when a passive thumbnail has arrived (isolated-session mode gave us
     something to watch); the local backend never streams, so the button
     stays absent on the live-desktop path. */
  #takeover-btn {
    background: #1d4ed8;
    display: none;
  }
  #takeover-btn:hover { background: #2563eb; }
  body.taken-over #takeover-btn { background: #16a34a; }
  body.taken-over #takeover-btn:hover { background: #22c55e; }
  body.has-thumbnail #takeover-btn { display: inline-block; }

  /* Passive thumbnail. Small so the orb stays the visual anchor; capped
     because a 200x200 window can't spare more. hidden by default -- shown
     only once a frame has actually arrived. */
  #thumbnail {
    display: none;
    width: 180px;
    max-height: 60px;
    object-fit: contain;
    border-radius: 4px;
    margin-top: 4px;
    background: #000;
    pointer-events: none;
  }
  body.has-thumbnail #thumbnail { display: block; }

  /* ── Orb container ─────────────────────────────────────── */
  .orb-wrap {
    position: relative;
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Core orb ──────────────────────────────────────────── */
  .orb {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 38%,
      #c084fc 0%,
      #7c3aed 45%,
      #1e0a3c 100%);
    box-shadow:
      0 0 20px 4px rgba(124, 58, 237, 0.4),
      0 0 40px 8px rgba(124, 58, 237, 0.15);
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform, opacity, box-shadow;
  }

  /* Outer glow ring */
  .ring {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1.5px solid rgba(192, 132, 252, 0.15);
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Waveform bars (speaking state) */
  .wave {
    position: absolute;
    bottom: 0px;
    display: flex;
    gap: 4px;
    align-items: flex-end;
    height: 36px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .wave span {
    width: 4px;
    border-radius: 2px;
    background: linear-gradient(to top, #7c3aed, #c084fc);
    transform-origin: bottom;
  }

  /* ── STATE: passive ────────────────────────────────────── */
  body.passive .orb {
    animation: pulse-passive 3.5s ease-in-out infinite;
  }
  body.passive .ring {
    animation: ring-passive 3.5s ease-in-out infinite;
  }

  @keyframes pulse-passive {
    0%, 100% { transform: scale(1);    opacity: 0.75; }
    50%       { transform: scale(1.06); opacity: 0.90; }
  }
  @keyframes ring-passive {
    0%, 100% { transform: scale(1);    opacity: 0.3; }
    50%       { transform: scale(1.12); opacity: 0.6; }
  }

  /* ── STATE: active ─────────────────────────────────────── */
  body.active .orb {
    background: radial-gradient(circle at 38% 38%,
      #e879f9 0%,
      #9333ea 45%,
      #2e0a4c 100%);
    box-shadow:
      0 0 28px 8px  rgba(147, 51, 234, 0.65),
      0 0 60px 16px rgba(147, 51, 234, 0.25);
    animation: pulse-active 1.1s ease-in-out infinite;
  }
  body.active .ring {
    border-color: rgba(232, 121, 249, 0.45);
    animation: ring-active 1.1s ease-in-out infinite;
  }

  @keyframes pulse-active {
    0%, 100% { transform: scale(1);    }
    50%       { transform: scale(1.10); }
  }
  @keyframes ring-active {
    0%, 100% { transform: scale(1);    opacity: 0.5; }
    50%       { transform: scale(1.18); opacity: 0.9; }
  }

  /* ── STATE: thinking ───────────────────────────────────── */
  body.thinking .orb {
    background: radial-gradient(circle at 38% 38%,
      #a5f3fc 0%,
      #0891b2 45%,
      #0a1c2c 100%);
    box-shadow:
      0 0 24px 6px  rgba(8, 145, 178, 0.5),
      0 0 50px 12px rgba(8, 145, 178, 0.2);
    animation: spin-thinking 1.8s linear infinite;
  }
  body.thinking .ring {
    border-color: rgba(165, 243, 252, 0.4);
    border-top-color: rgba(165, 243, 252, 0.9);
    animation: spin-ring 1.2s linear infinite;
  }

  @keyframes spin-thinking {
    0%   { transform: rotate(0deg)   scale(1);    }
    50%  { transform: rotate(180deg) scale(1.07); }
    100% { transform: rotate(360deg) scale(1);    }
  }
  @keyframes spin-ring {
    to { transform: rotate(360deg); }
  }

  /* ── STATE: speaking ───────────────────────────────────── */
  body.speaking .orb {
    background: radial-gradient(circle at 38% 38%,
      #fb923c 0%,
      #9333ea 45%,
      #1e0a3c 100%);
    box-shadow:
      0 0 24px 6px  rgba(251, 146, 60, 0.45),
      0 0 50px 12px rgba(147, 51, 234, 0.25);
    animation: breathe-speaking 0.6s ease-in-out infinite alternate;
  }
  body.speaking .ring {
    border-color: rgba(251, 146, 60, 0.35);
    animation: ring-breathe 0.6s ease-in-out infinite alternate;
  }
  body.speaking .wave {
    opacity: 1;
  }
  body.speaking .wave span:nth-child(1) { animation: bar 0.5s ease-in-out 0.0s infinite alternate; }
  body.speaking .wave span:nth-child(2) { animation: bar 0.5s ease-in-out 0.1s infinite alternate; }
  body.speaking .wave span:nth-child(3) { animation: bar 0.5s ease-in-out 0.2s infinite alternate; }
  body.speaking .wave span:nth-child(4) { animation: bar 0.5s ease-in-out 0.3s infinite alternate; }
  body.speaking .wave span:nth-child(5) { animation: bar 0.5s ease-in-out 0.4s infinite alternate; }

  @keyframes breathe-speaking {
    from { transform: scale(0.96); }
    to   { transform: scale(1.04); }
  }
  @keyframes ring-breathe {
    from { transform: scale(1);    opacity: 0.4; }
    to   { transform: scale(1.15); opacity: 0.8; }
  }
  @keyframes bar {
    from { height: 6px;  }
    to   { height: 28px; }
  }
</style>
</head>
<body class="passive">

<div class="driving-panel" id="driving-panel">
  <div id="driving-text">Felix is driving</div>
  <img id="thumbnail" alt="" />
  <div style="display: flex; gap: 6px;">
    <button id="stop-btn" type="button">STOP</button>
    <button id="takeover-btn" type="button">TAKE OVER</button>
  </div>
</div>

<div class="orb-wrap">
  <div class="ring"></div>
  <div class="orb"></div>
  <div class="wave">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>

<script>
  const { ipcRenderer } = require('electron');

  // Map of Cerebral IPC event types → CSS state class
  const EVENT_STATES = {
    wake:         'active',
    passive:      'passive',
    tts_speaking: 'speaking',
    tts_done:     'passive',
    thinking:     'thinking',
  };

  function setState(cls) {
    const b = document.body;
    const known = Object.values(EVENT_STATES);
    known.forEach(c => b.classList.remove(c));
    b.classList.add(cls);
  }

  ipcRenderer.on('visualiser:state', (_e, newState) => {
    setState(newState);
  });

  // S2 #576 (ADR-0016 (c)): the "Felix is driving" overlay + Stop control.
  // #594 (ADR-0016 amendment f): mode-aware -- the payload is now an object
  // ({driving, mode, windowTitle, action}), not a bare bool. Tolerate a bare
  // bool too (backward-compat: must not crash on an old-shaped payload).
  const drivingTextEl = document.getElementById('driving-text');
  ipcRenderer.on('visualiser:driving', (_e, payload) => {
    const p = (payload && typeof payload === 'object') ? payload : { driving: !!payload };
    const driving = !!p.driving;
    document.body.classList.toggle('driving', driving);
    if (!driving) {
      document.body.classList.remove('mode-background');
      return;
    }
    const isBackground = p.mode === 'background';
    document.body.classList.toggle('mode-background', isBackground);
    const windowTitle = p.windowTitle || p.window_title || 'the background';
    drivingTextEl.textContent = isBackground
      ? `Felix is acting in ${windowTitle} (background) -- you can keep working`
      : 'Felix is driving';
  });

  document.getElementById('stop-btn').addEventListener('click', () => {
    ipcRenderer.send('computer-use:stop');
  });

  // S15 #609: passive thumbnail stream from Felix's isolated session. Every
  // frame is a data: URL swap on the same <img> -- no persistence, matches
  // ADR-0016 sec 7 (raw pixels never touch disk). body.has-thumbnail reveals
  // both the <img> and the Take-over button on the first arrival.
  const thumbEl = document.getElementById('thumbnail');
  ipcRenderer.on('visualiser:thumbnail', (_e, frame_b64) => {
    thumbEl.src = `data:image/png;base64,${frame_b64}`;
    document.body.classList.add('has-thumbnail');
  });

  // S15 #609: Take-over / Release. One button, two states -- reuses the
  // existing modal-manager pattern (single control that flips label based on
  // server-authoritative state). Cerebral broadcasts computer_use:taken_over
  // on both flips so a mid-session tray restart re-syncs correctly.
  const takeoverBtn = document.getElementById('takeover-btn');
  ipcRenderer.on('visualiser:taken-over', (_e, takenOver) => {
    document.body.classList.toggle('taken-over', !!takenOver);
    takeoverBtn.textContent = takenOver ? 'RELEASE' : 'TAKE OVER';
  });
  takeoverBtn.addEventListener('click', () => {
    // Server-authoritative: send the intent, wait for the broadcast to flip
    // the label. Prevents click-vs-broadcast races on double-click.
    const takenOver = document.body.classList.contains('taken-over');
    ipcRenderer.send(takenOver ? 'computer-use:release' : 'computer-use:take-over');
  });
</script>
</body>
</html>
