<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Felix Visualiser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 200px;
    height: 200px;
    background: transparent;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
  }

  /* ── Orb container ─────────────────────────────────────── */
  .orb-wrap {
    position: relative;
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Core orb ──────────────────────────────────────────── */
  .orb {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 38%,
      #c084fc 0%,
      #7c3aed 45%,
      #1e0a3c 100%);
    box-shadow:
      0 0 20px 4px rgba(124, 58, 237, 0.4),
      0 0 40px 8px rgba(124, 58, 237, 0.15);
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform, opacity, box-shadow;
  }

  /* Outer glow ring */
  .ring {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1.5px solid rgba(192, 132, 252, 0.15);
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Waveform bars (speaking state) */
  .wave {
    position: absolute;
    bottom: 0px;
    display: flex;
    gap: 4px;
    align-items: flex-end;
    height: 36px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .wave span {
    width: 4px;
    border-radius: 2px;
    background: linear-gradient(to top, #7c3aed, #c084fc);
    transform-origin: bottom;
  }

  /* ── STATE: passive ────────────────────────────────────── */
  body.passive .orb {
    animation: pulse-passive 3.5s ease-in-out infinite;
  }
  body.passive .ring {
    animation: ring-passive 3.5s ease-in-out infinite;
  }

  @keyframes pulse-passive {
    0%, 100% { transform: scale(1);    opacity: 0.75; }
    50%       { transform: scale(1.06); opacity: 0.90; }
  }
  @keyframes ring-passive {
    0%, 100% { transform: scale(1);    opacity: 0.3; }
    50%       { transform: scale(1.12); opacity: 0.6; }
  }

  /* ── STATE: active ─────────────────────────────────────── */
  body.active .orb {
    background: radial-gradient(circle at 38% 38%,
      #e879f9 0%,
      #9333ea 45%,
      #2e0a4c 100%);
    box-shadow:
      0 0 28px 8px  rgba(147, 51, 234, 0.65),
      0 0 60px 16px rgba(147, 51, 234, 0.25);
    animation: pulse-active 1.1s ease-in-out infinite;
  }
  body.active .ring {
    border-color: rgba(232, 121, 249, 0.45);
    animation: ring-active 1.1s ease-in-out infinite;
  }

  @keyframes pulse-active {
    0%, 100% { transform: scale(1);    }
    50%       { transform: scale(1.10); }
  }
  @keyframes ring-active {
    0%, 100% { transform: scale(1);    opacity: 0.5; }
    50%       { transform: scale(1.18); opacity: 0.9; }
  }

  /* ── STATE: thinking ───────────────────────────────────── */
  body.thinking .orb {
    background: radial-gradient(circle at 38% 38%,
      #a5f3fc 0%,
      #0891b2 45%,
      #0a1c2c 100%);
    box-shadow:
      0 0 24px 6px  rgba(8, 145, 178, 0.5),
      0 0 50px 12px rgba(8, 145, 178, 0.2);
    animation: spin-thinking 1.8s linear infinite;
  }
  body.thinking .ring {
    border-color: rgba(165, 243, 252, 0.4);
    border-top-color: rgba(165, 243, 252, 0.9);
    animation: spin-ring 1.2s linear infinite;
  }

  @keyframes spin-thinking {
    0%   { transform: rotate(0deg)   scale(1);    }
    50%  { transform: rotate(180deg) scale(1.07); }
    100% { transform: rotate(360deg) scale(1);    }
  }
  @keyframes spin-ring {
    to { transform: rotate(360deg); }
  }

  /* ── STATE: speaking ───────────────────────────────────── */
  body.speaking .orb {
    background: radial-gradient(circle at 38% 38%,
      #fb923c 0%,
      #9333ea 45%,
      #1e0a3c 100%);
    box-shadow:
      0 0 24px 6px  rgba(251, 146, 60, 0.45),
      0 0 50px 12px rgba(147, 51, 234, 0.25);
    animation: breathe-speaking 0.6s ease-in-out infinite alternate;
  }
  body.speaking .ring {
    border-color: rgba(251, 146, 60, 0.35);
    animation: ring-breathe 0.6s ease-in-out infinite alternate;
  }
  body.speaking .wave {
    opacity: 1;
  }
  body.speaking .wave span:nth-child(1) { animation: bar 0.5s ease-in-out 0.0s infinite alternate; }
  body.speaking .wave span:nth-child(2) { animation: bar 0.5s ease-in-out 0.1s infinite alternate; }
  body.speaking .wave span:nth-child(3) { animation: bar 0.5s ease-in-out 0.2s infinite alternate; }
  body.speaking .wave span:nth-child(4) { animation: bar 0.5s ease-in-out 0.3s infinite alternate; }
  body.speaking .wave span:nth-child(5) { animation: bar 0.5s ease-in-out 0.4s infinite alternate; }

  @keyframes breathe-speaking {
    from { transform: scale(0.96); }
    to   { transform: scale(1.04); }
  }
  @keyframes ring-breathe {
    from { transform: scale(1);    opacity: 0.4; }
    to   { transform: scale(1.15); opacity: 0.8; }
  }
  @keyframes bar {
    from { height: 6px;  }
    to   { height: 28px; }
  }
</style>
</head>
<body class="passive">

<div class="orb-wrap">
  <div class="ring"></div>
  <div class="orb"></div>
  <div class="wave">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>

<script>
  const { ipcRenderer } = require('electron');

  // Map of Cerebral IPC event types → CSS state class
  const EVENT_STATES = {
    wake:         'active',
    passive:      'passive',
    tts_speaking: 'speaking',
    tts_done:     'passive',
    thinking:     'thinking',
  };

  function setState(cls) {
    const b = document.body;
    const known = Object.values(EVENT_STATES);
    known.forEach(c => b.classList.remove(c));
    b.classList.add(cls);
  }

  ipcRenderer.on('visualiser:state', (_e, newState) => {
    setState(newState);
  });
</script>
</body>
</html>
