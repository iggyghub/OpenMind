<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Felix — Queue</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #12101e;
      color: #e2e0f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── header ─────────────────────────────────────────────── */
    .header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #2a2640;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .orb {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #7c5cfc;
      box-shadow: 0 0 8px #7c5cfc88;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 13px;
      font-weight: 600;
      color: #c8c4e8;
      letter-spacing: 0.02em;
    }

    .badge {
      margin-left: auto;
      background: #7c5cfc;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      border-radius: 10px;
      padding: 2px 7px;
      min-width: 20px;
      text-align: center;
      display: none;
    }

    .badge.visible { display: block; }

    /* ── item list ───────────────────────────────────────────── */
    .list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .list::-webkit-scrollbar { width: 4px; }
    .list::-webkit-scrollbar-track { background: transparent; }
    .list::-webkit-scrollbar-thumb { background: #3a3460; border-radius: 2px; }

    /* ── empty state ─────────────────────────────────────────── */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 8px;
      color: #5c5880;
      user-select: none;
    }

    .empty-icon {
      font-size: 28px;
      opacity: 0.5;
    }

    .empty-text {
      font-size: 13px;
    }

    /* ── queue item ──────────────────────────────────────────── */
    .item {
      padding: 10px 14px;
      border-bottom: 1px solid #1e1c30;
      animation: fadeIn 0.15s ease;
    }

    .item:last-child { border-bottom: none; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .item-title {
      font-size: 13px;
      font-weight: 600;
      color: #d8d4f0;
      margin-bottom: 3px;
      line-height: 1.3;
    }

    .item-summary {
      font-size: 12px;
      color: #8882aa;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .item-tool {
      font-size: 11px;
      color: #5a5680;
      margin-bottom: 8px;
      font-family: 'Courier New', monospace;
    }

    .item-actions {
      display: flex;
      gap: 6px;
    }

    .btn {
      flex: 1;
      padding: 5px 0;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.1s, transform 0.1s;
      letter-spacing: 0.01em;
    }

    .btn:active { opacity: 0.75; transform: scale(0.97); }

    .btn-approve {
      background: #7c5cfc;
      color: #fff;
    }

    .btn-approve:hover { background: #8d6ffd; }

    .btn-dismiss {
      background: #2a2640;
      color: #8882aa;
    }

    .btn-dismiss:hover { background: #332f54; color: #aaa6cc; }

    /* result flash */
    .item.result-ok   { border-left: 3px solid #4caf82; }
    .item.result-err  { border-left: 3px solid #e05555; }

    /* ── footer ─────────────────────────────────────────────── */
    .footer {
      padding: 8px 14px;
      border-top: 1px solid #2a2640;
      display: flex;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .btn-clear {
      background: none;
      border: 1px solid #2a2640;
      border-radius: 4px;
      color: #5c5880;
      font-size: 11px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .btn-clear:hover { color: #e05555; border-color: #e05555; }
  </style>
</head>
<body>
  <div class="header">
    <div class="orb"></div>
    <span class="header-title">Pending actions</span>
    <span class="badge" id="badge">0</span>
  </div>

  <div class="list" id="list">
    <div class="empty" id="empty">
      <div class="empty-icon">✦</div>
      <div class="empty-text">No pending actions</div>
    </div>
  </div>

  <div class="footer">
    <button class="btn-clear" id="btn-clear">Clear all</button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const listEl  = document.getElementById('list');
    const emptyEl = document.getElementById('empty');
    const badgeEl = document.getElementById('badge');

    let items = [];

    // ── render ──────────────────────────────────────────────────────────────
    function render() {
      // Remove all item nodes (keep the empty placeholder)
      listEl.querySelectorAll('.item').forEach(el => el.remove());

      if (items.length === 0) {
        emptyEl.style.display = 'flex';
        badgeEl.classList.remove('visible');
        return;
      }

      emptyEl.style.display = 'none';
      badgeEl.textContent = items.length;
      badgeEl.classList.add('visible');

      items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'item';
        el.dataset.id = item.id;

        const toolLine = item.tool_name
          ? `<div class="item-tool">⚙ ${item.tool_name}</div>`
          : '';

        el.innerHTML = `
          <div class="item-title">${esc(item.title)}</div>
          <div class="item-summary">${esc(item.summary)}</div>
          ${toolLine}
          <div class="item-actions">
            <button class="btn btn-approve" data-id="${item.id}">Approve</button>
            <button class="btn btn-dismiss" data-id="${item.id}">Dismiss</button>
          </div>
        `;

        listEl.insertBefore(el, emptyEl);
      });
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ── button clicks ───────────────────────────────────────────────────────
    listEl.addEventListener('click', e => {
      const btn = e.target.closest('.btn');
      if (!btn) return;
      const id = btn.dataset.id;

      if (btn.classList.contains('btn-approve')) {
        ipcRenderer.send('queue:approve', id);
        btn.disabled = true;
        btn.textContent = 'Approving…';
      } else if (btn.classList.contains('btn-dismiss')) {
        ipcRenderer.send('queue:dismiss', id);
        // Optimistically remove
        items = items.filter(i => i.id !== id);
        render();
      }
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      ipcRenderer.send('queue:clear');
    });

    // ── IPC from main process ───────────────────────────────────────────────
    ipcRenderer.on('queue:items', (_e, newItems) => {
      items = newItems;
      render();
    });

    ipcRenderer.on('queue:item-result', (_e, { item_id, result, is_error }) => {
      const el = listEl.querySelector(`.item[data-id="${item_id}"]`);
      if (!el) return;
      el.classList.add(is_error ? 'result-err' : 'result-ok');
      const approveBtn = el.querySelector('.btn-approve');
      if (approveBtn) {
        approveBtn.textContent = is_error ? 'Error' : 'Done';
        approveBtn.disabled = true;
      }
      // Auto-remove after 1.5 s
      setTimeout(() => {
        items = items.filter(i => i.id !== item_id);
        render();
      }, 1500);
    });

    // Request initial queue on load
    ipcRenderer.send('queue:request');
  </script>
</body>
</html>
