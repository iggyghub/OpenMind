[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmind-cerebral"
version = "0.1.0"
description = "Cerebral — the central Python backend for OpenMind / Felix"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "OpenMind" }]

# Runtime dependencies — kept in sync with the contents of
# cerebral/requirements.txt (now a pointer; see that file).
dependencies = [
    "websockets>=12.0",
    "chromadb>=1.5.0",
    "vosk>=0.3.45",
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "kokoro>=0.9.4",
    "soundfile>=0.12.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "pyperclip>=1.8.0",
    "feedparser>=6.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "keyring>=24.0",
    "mcp>=1.26.0",
    "playwright>=1.58",
    "pypdf>=4.0",
    "anthropic>=0.83",
    "python-jobspy>=1.1",  # B4 #511: big-board search (LinkedIn/Indeed/Glassdoor); lazy-imported
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cerebral*"]
exclude = ["cerebral.tests*"]

# Mirror of cerebral/pytest.ini so `python -m pytest` run from the repo root
# resolves to this config (rootdir C:\OpenMind) with the SAME asyncio_mode the
# async suite was written for. Without this, a root-level run picks pyproject.toml
# as the config file in STRICT mode and every bare `async def` test errors with
# "async def functions are not natively supported" (~400 false failures).
# cerebral/pytest.ini still wins when pytest is invoked from inside cerebral/.
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["cerebral/tests"]
markers = [
    "integration: requires live services (Ollama, OpenClaw); skipped in CI by default",
]
